[pytest]
markers =
    gpu: requires CUDA (training / inference smoke)
    slow: long-running integration tests
    training_smoke: end-to-end training on car_dataset fixture
    ultralytics: Ultralytics YOLO / RT-DETR training smoke
    mmyolo: MMYOLO training smoke
    integration: requires live Docker stack / Postgres fixtures (LAI_INTEGRATION_TESTS=1)
    insid3_smoke: INSID3 same-image smoke inside sam_service (GPU profile, DINOv3 weights)
testpaths =
    tests/python
