# Full stack: backend services (dockers/backend/docker-compose.yml) + web UI.
# Requires Docker Compose v2.24+ (include).
#
# Developers: use `lai dev` or `lai build` — NOT `docker compose up --build`
# (backend requires lai-mmyolo:local built via --profile build first).
#
# Local build (default): lai dev   or   lai build && lai up
# Pre-built images: set LAI_*_IMAGE in .env, then lai pull && lai up
#
# Project name → container names like lai-backend-1. Override: COMPOSE_PROJECT_NAME.
name: lai

include:
  - path: backend/docker-compose.yml

services:
  web:
    image: ${LAI_FRONTEND_IMAGE:-lai-frontend:local}
    build:
      context: ..
      dockerfile: dockers/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-SAME_ORIGIN}
    ports:
      - "${WEB_PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
